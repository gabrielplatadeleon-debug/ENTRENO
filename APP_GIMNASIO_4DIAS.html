<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090d16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MI APP 4 DIAS V1.1 - Pro HUD</title>
<link rel="manifest" href='data:application/manifest+json,{
  "name": "MI APP 4 DIAS",
  "short_name": "Entreno",
  "start_url": "./",
  "display": "standalone",
  "background_color": "#090d16",
  "theme_color": "#090d16",
  "icons": [{
    "src": "https://cdn-icons-png.flaticon.com/512/2965/2965567.png",
    "sizes": "512x512",
    "type": "image/png"
  }]
}'>
<style>
:root{--fs:16px;--bg:#090d16;--card:#121826;--card-hover:#1a2234;--text:#f8fafc;--muted:#94a3b8;--line:#1e293b;--line2:#161e31;--accent:#22c55e;--accent-glow:rgba(34,197,94,0.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs);overflow-x:hidden}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;line-height:1.4}
header{position:sticky;top:0;z-index:30;background:rgba(9,13,22,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:8px}
.logo{font-size:17px;font-weight:900;letter-spacing:-.03em;color:#fff;display:flex;align-items:center;gap:6px}
.logo span{font-weight:400;color:var(--accent);background:rgba(34,197,94,0.1);padding:2px 8px;border-radius:6px;font-size:12px}
.h-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:auto}
.btn-h{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#1a2234;color:#f8fafc;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;transition:.2s}
.btn-h:hover{border-color:var(--muted)}
.btn-h.dark{background:#fff;color:#090d16;border-color:#fff}
.btn-h.green{background:var(--accent);border-color:var(--accent);color:#090d16;box-shadow:0 0 15px var(--accent-glow)}
.btn-h.red{background:#ef4444;border-color:#ef4444;color:#fff}
.badge-live{font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px;background:var(--accent);color:#090d16;display:none}
.badge-live.on{display:inline-block;animation:pulse 1.5s infinite}
.session-timer{font-size:12px;font-weight:800;color:var(--accent);background:rgba(34,197,94,0.1);padding:5px 10px;border-radius:8px;border:1px solid rgba(34,197,94,0.3)}
@keyframes pulse{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
.tabs{display:flex;gap:8px;padding:12px 14px;overflow-x:auto;white-space:nowrap;background:var(--bg);position:sticky;top:60px;z-index:20;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{height:40px;padding:8px 16px;border-radius:12px;font-size:13px;font-weight:800;letter-spacing:.02em;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;flex-shrink:0;transition:.2s}
.tab.active{background:var(--accent);color:#090d16;border-color:var(--accent);box-shadow:0 4px 15px var(--accent-glow)}
.tab small{font-weight:600;opacity:.8;margin-left:4px;font-size:11px}
.wrap{max-width:760px;margin:0 auto;padding:4px 14px 160px;width:100%;overflow-x:hidden}
.subhead{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 6px}
.subhead-left{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.subhead-right{font-size:11px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.3);overflow:hidden;margin:14px 0;transition:.2s}
.card:hover{border-color:#2a374a}
.card-top{width:100%;text-align:left;background:transparent;border:none;padding:16px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center}
.card-title{font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:1.2;color:#fff;flex:1;min-width:0}
.card-meta{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.4;display:flex;flex-wrap:wrap;gap:0 6px}
.card-meta span.dot{opacity:.3}
.arrow{width:36px;height:36px;border-radius:10px;background:var(--line);color:var(--text);display:grid;place-items:center;flex-shrink:0;font-size:14px;font-weight:800;transition:.2s}
.arrow.open{background:var(--accent);color:#090d16;transform:rotate(180deg);box-shadow:0 0 10px var(--accent-glow)}
.card-body{padding:0 16px 16px;border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.label{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
.ul{margin:0;padding-left:14px;display:flex;flex-direction:column;gap:5px}
.ul li{font-size:13px;color:#cbd5e1;line-height:1.4}
.ul li.muted{color:var(--muted)}
.registro{margin-top:14px;background:#090d16;border:1px solid var(--line);border-radius:12px;padding:14px}
.reg-title{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;text-transform:uppercase}
.row-peso{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.row-peso .lbl{font-size:12px;font-weight:700;color:var(--muted);min-width:36px}
.btn-w{height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:800;color:#fff;cursor:pointer;min-width:48px;transition:.15s}
.btn-w:hover{background:var(--card-hover)}
.btn-w.display{min-width:90px;height:38px;background:#1a2234;border:1px solid #334155;border-radius:10px;display:grid;place-items:center;font-size:15px;font-weight:900;color:var(--accent)}
.row-reps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.ctrl{display:flex;align-items:center;gap:8px}
.ctrl .lbl2{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.btn-s{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:16px;font-weight:900;color:#fff;cursor:pointer;display:grid;place-items:center;transition:.15s}
.btn-s:hover{background:var(--card-hover)}
.display-s{min-width:40px;height:38px;background:#1a2234;border:1px solid #334155;border-radius:10px;display:grid;place-items:center;font-size:15px;font-weight:900;color:#fff}
.btn-save{width:100%;height:46px;border-radius:12px;border:none;background:var(--accent);color:#090d16;font-size:15px;font-weight:900;letter-spacing:.02em;cursor:pointer;box-shadow:0 4px 15px var(--accent-glow);margin-top:8px;transition:.2s}
.btn-save:hover{filter:brightness(1.1)}
.btn-save:active{transform:scale(.98)}
.input-note{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:12px;margin-bottom:10px;background:#1a2234;color:#fff;outline:none}
.input-note:focus{border-color:var(--accent)}
.rest-inline{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:13px;color:#fff}
.bar{width:80px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);transition:width 1s linear}
.btn-skip{margin-left:auto;font-size:12px;background:#1a2234;border:1px solid var(--line);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.historial{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:14px;scrollbar-width:none}
.historial::-webkit-scrollbar{display:none}
.chip{font-size:12px;background:#1a2234;border:1px solid var(--line);border-radius:10px;padding:6px 10px;white-space:nowrap;color:#cbd5e1}
.chip b{font-weight:800;color:#fff}
.chip .date{color:var(--muted);font-size:11px}

/* focus mode */
.focus-wrap{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
.focus-wrap.on{display:flex}
.focus-top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(9,13,22,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);flex-shrink:0}
.focus-body{flex:1;overflow-y:auto;padding:14px;max-width:720px;width:100%;margin:0 auto}
.focus-nav{padding:12px 14px;background:rgba(9,13,22,.88);border-top:1px solid var(--line);display:flex;gap:10px;max-width:720px;width:100%;margin:0 auto}
.focus-nav .btn-h{flex:1;height:44px;border-radius:12px;font-size:13px;font-weight:800}

/* progreso V1.1 */
.progress{margin-top:24px}
.progress h2{font-size:16px;margin:20px 4px 10px;font-weight:900;letter-spacing:-.2px;color:#fff}
details.prog{border:1px solid var(--line);background:var(--card);border-radius:14px;margin:10px 0;overflow:hidden}
details.prog summary{list-style:none;padding:14px 16px;font-size:13px;font-weight:800;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:#fff}
details.prog summary::-webkit-details-marker{display:none}
.sum-sub{font-weight:600;color:var(--muted);font-size:12px}
.detail-inner{padding:0 16px 14px;font-size:13px;color:#cbd5e1;border-top:1px solid var(--line);background:#090d16}
.detail-inner div.item{padding:8px 0;border-bottom:1px dashed var(--line)}
.detail-inner div.item:last-child{border:none}
.exports{display:flex;flex-wrap:wrap;gap:8px;padding:8px 2px 14px}
.prog-line{margin:10px 0 8px;padding:10px 12px;background:rgba(34,197,94,0.05);border:1px solid rgba(34,197,94,0.2);border-radius:10px;font-size:12px;color:#4ade80;line-height:1.4;display:flex;flex-direction:column;gap:3px}
.prog-line .row{display:flex;gap:10px;flex-wrap:wrap}
.prog-line b{font-weight:900;color:#86efac}
.prog-line .suggest{margin-top:4px;padding:4px 8px;background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);border-radius:8px;font-weight:800;display:inline-block}
.prog-line .muted{color:var(--muted)}

.plate-calc{margin:10px 0 12px;padding:10px 12px;background:rgba(234,179,8,0.06);border:1px dashed rgba(234,179,8,0.3);border-radius:12px;font-size:12px;color:#fde047;display:flex;flex-wrap:wrap;gap:8px;align-items:center;line-height:1.4}
.plate-calc b{font-weight:900}
.plate-calc .bar-tag{font-size:10px;background:rgba(234,179,8,0.15);border:1px solid rgba(234,179,8,0.3);border-radius:999px;padding:3px 8px;font-weight:900;cursor:pointer;color:#fef08a}

.empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}

/* rest bottom modal */
.rest{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;background:var(--card);color:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 20px;display:none;align-items:center;gap:16px;box-shadow:0 15px 40px rgba(0,0,0,.6);min-width:320px}
.rest.on{display:flex}
.rest-time{font-size:30px;font-weight:900;min-width:90px;letter-spacing:-1px;color:var(--accent)}
.rest-info{font-size:12px;line-height:1.3}
.rest-info b{display:block;font-size:14px;margin-bottom:2px;color:#fff}
</style>
</head>
<body>
<header>
  <div class="logo">MI APP <span>4 DIAS v1.1</span></div>
  <div class="h-actions">
    <span id="wakeBadge" class="badge-live">Activa</span>
    <span id="sessionTimer" class="session-timer" style="display:none">00:00</span>
    <button class="btn-h green" id="btnSession">Empezar</button>
    <button class="btn-h dark" id="btnFocus">FOCUS</button>
    <button class="btn-h" id="btnMinus">A-</button>
    <button class="btn-h" id="btnPlus">A+</button>
  </div>
</header>
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="subhead"><div class="subhead-left" id="subLeft">LUNES · UPPER FUERZA</div><div class="subhead-right" id="subRight">5 ejercicios</div></div>
  <div id="list"></div>

  <div class="progress">
    <h2>Progreso y Opciones (Pro UI)</h2>
    <div class="exports">
      <button class="btn-h" id="expDia">Exportar Día</button>
      <button class="btn-h" id="expFecha">Exportar Fecha</button>
      <button class="btn-h" id="expTodo">Todo JSON</button>
      <button class="btn-h" id="expCSV">CSV</button>
      <button class="btn-h green" id="expWA">WhatsApp Día</button>
      <button class="btn-h dark" id="btnImport">Importar JSON</button>
      <input type="file" id="fileImport" accept=".json" style="display:none">
      <button class="btn-h red" id="btnClearAll">Borrar todo</button>
    </div>
    <div id="progFecha"></div>
    <div id="progDia" style="margin-top:12px"></div>
  </div>
</div>

<div class="focus-wrap" id="focusWrap">
  <div class="focus-top">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn-h" id="focusClose">Salir</button>
      <div style="font-size:13px;font-weight:800" id="focusCounter">1/5 · LUNES</div>
    </div>
    <div style="font-size:12px;color:var(--muted)" id="focusSub">UPPER FUERZA</div>
  </div>
  <div class="focus-body" id="focusBody"></div>
  <div class="focus-nav">
    <button class="btn-h" id="focusPrev">Anterior</button>
    <button class="btn-h dark" id="focusNext">Siguiente</button>
  </div>
</div>

<div class="rest" id="restBox"><div class="rest-time" id="restTime">02:00</div><div class="rest-info"><b id="restLabel">Descanso</b><span id="restNext">Siguiente</span><div style="margin-top:8px;display:flex;gap:8px"><button class="btn-h" id="restSkip" style="background:#1a2234;border:none;height:30px">Saltar</button><button class="btn-h green" id="restPlus" style="height:30px;color:#090d16">+30s</button></div></div></div>

<div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;background:#1a2234;color:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;padding:12px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none"></div>

<script>
const STORAGE_KEY='miApp_4dias_v1_1_pro';
const RUTINA_DATA=[
{label:"LUNES",sub:"UPPER FUERZA",ejercicios:[
{id:"press-banca",nombre:"PRESS BANCA",series:4,repeticiones:"4 a 6",rir:"2",descanso:"2.5-3 min",tempo:"2-1-1-0",como:["Retrae escápulas y pies firmes en el suelo","Baja controlado al pecho medio, codos 45°","Presiona vertical sin rebotar, bloquea arriba"],errores:["Arquear lumbar excesivo o rebotar barra","Codos totalmente abiertos a 90°"]},
{id:"remo-barra",nombre:"REMO BARRA",series:4,repeticiones:"5 a 7",rir:"2",descanso:"2.5 min",tempo:"2-1-1-0",como:["Bisagra cadera, torso 30-45° estable","Rema hacia ombligo bajo, barra pegada","Aprieta dorsales 1s arriba, baja lento"],errores:["Tirar con impulso de lumbar","Encoger hombros hacia orejas"]},
{id:"press-inclinado-manc",nombre:"PRESS INCLINADO MANCUERNAS",series:3,repeticiones:"6 a 8",rir:"2",descanso:"2 min",tempo:"2-1-1-0",como:["Banco 30°, muñecas neutras arriba","Baja hasta estiramiento pecho sin chocar","Sube sin juntar mancuernas bruscamente"],errores:["Banco demasiado vertical","Arco dorsal inestable"]},
{id:"jalon-neutro",nombre:"JALON NEUTRO",series:3,repeticiones:"8 a 10",rir:"2",descanso:"2 min",tempo:"2-1-1-0",como:["Agarre neutro cerrado, pecho alto","Tira codos hacia costillas, no hacia atrás","Estira completo sin perder tensión"],errores:["Inclinarse mucho hacia atrás","Usar solo bíceps sin deprimir escápulas"]},
{id:"elev-lateral",nombre:"ELEVACION LATERAL",series:2,repeticiones:"12 a 15",rir:"1-2",descanso:"75s",tempo:"2-0-1-0",como:["Mancuernas a lados, codo semi flexionado","Eleva hasta altura hombro liderando codo","Baja 2s sin balanceo"],errores:["Usar trapecio para subir","Balancear tronco para impulso"]}
]},
{label:"MARTES",sub:"LOWER FUERZA",ejercicios:[

{id:"prensa-45",nombre:"PRENSA 45",series:2,repeticiones:"8 a 10",rir:"2",descanso:"2 min",tempo:"2-1-1-0",como:["Pies medios plataforma, lumbar apoyada","Baja controlado hasta 90° rodilla","Empuja sin bloquear rodillas violento"],errores:["Glúteo se despega abajo","Bajar muy corto por ego"]},
{id:"curl-fem-tumbado",nombre:"CURL FEMORAL TUMBADO",series:3,repeticiones:"8 a 10",rir:"1-2",descanso:"90s",tempo:"2-1-1-0",como:["Cadera pegada al banco, agarre firme","Flexiona hasta tope sin levantar cadera","Baja lento 2s"],errores:["Elevar cadera para trampear","Rango parcial constante"]},
{id:"gemelo-pie",nombre:"GEMELO DE PIE",series:4,repeticiones:"8 a 12",rir:"1",descanso:"90s",tempo:"2-1-1-1",como:["Apoyo antepié, estira abajo completo","Pausa 1s arriba contrayendo fuerte","Rodilla extendida sin bloqueo"],errores:["Rebotar sin control","No estirar abajo"]}

{label:"JUEVES",sub:"UPPER HIPERTROFIA",ejercicios:[

{id:"remo-polea",nombre:"REMO POLEA",series:3,repeticiones:"10 a 12",rir:"1-2",descanso:"90s",tempo:"2-1-1-1",como:["Torso vertical, agarre medio","Codos atrás, pausa 1s contra abdomen","Estira dorsal sin encorvar"],errores:["Jalar con impulso de tronco","No retraer escápula"]},
{id:"fondos",nombre:"FONDOS",series:3,repeticiones:"8 a 10",rir:"2",descanso:"2 min",tempo:"2-1-1-0",como:["Hombros deprimidos, leve inclinación","Baja hasta 90° codo, pecho estirado","Sube bloqueando sin encoger"],errores:["Hombros hacia orejas","Rango muy corto"]},
{id:"curl-inclinado",nombre:"CURL INCLINADO",series:3,repeticiones:"10 a 12",rir:"1-2",descanso:"90s",tempo:"2-0-1-1",como:["Banco 60°, hombros atrás","Curl sin mover hombro, supina completo","Baja lento estirando bíceps"],errores:["Balancear mancuerna con hombro","No extender abajo"]},
{id:"pajaros-maquina",nombre:"PAJAROS MAQUINA",series:3,repeticiones:"12 a 15",rir:"1",descanso:"60s",tempo:"2-1-1-0",como:["Pecho apoyado, agarre neutro","Abre codos atrás hasta línea hombro","Aprieta deltoide posterior arriba"],errores:["Usar trapecio superior","Rango excesivo hiperextendiendo"]},
{id:"face-pull",nombre:"FACE PULL",series:2,repeticiones:"15 a 20",rir:"2",descanso:"60s",tempo:"2-1-1-1",como:["Polea alta, cuerda a cara","Codos altos, rota externo al final","Pausa 1s apretando"],errores:["Tirar hacia pecho bajo","Codos bajos tipo remo"]}

{label:"VIERNES",sub:"LOWER HIPERTROFIA",ejercicios:[

function triggerHaptic(){ try{ if(navigator.vibrate) navigator.vibrate(25); }catch{} }
function parseRepRange(str){ if(!str) return {min:0,max:0}; const nums=str.match(/\d+/g); if(!nums) return {min:0,max:0}; if(nums.length>=2) return {min:parseInt(nums[0]), max:parseInt(nums[1])}; return {min:parseInt(nums[0]), max:parseInt(nums[0])}; }

function getProgressionInfo(exId, ex){
  const logs = (state.logs[exId]||[]);
  if(!logs.length) return null;
  const last = logs[0];
  let best = logs[0];
  for(let l of logs){ if(l.peso>best.peso || (l.peso===best.peso && l.reps>best.reps)) best=l; }
  const range = parseRepRange(ex.repeticiones);
  let suggest = null;
  if(range.max>0 && last.reps >= range.max && last.rir <=2){
    suggest = "+2.5kg próxima (" + (last.peso+2.5).toFixed(1) + "kg)";
  } else if(range.max>0 && last.reps > range.max){
    suggest = "+2.5kg próxima (" + (last.peso+2.5).toFixed(1) + "kg) - superas rango";
  }
  return {last, best, range, suggest};
}

function progressionHtml(exId, ex){
  const info = getProgressionInfo(exId, ex);
  if(!info) return '<div class="prog-line"><span class="muted">Sin registros aún - guarda tu primera serie</span></div>';
  const last = info.last;
  const best = info.best;
  let html = '<div class="prog-line"><div class="row"><span>Última: <b>' + last.peso + 'kg x ' + last.reps + ' RIR' + last.rir + '</b> <span class="muted">' + (last.date||'') + '</span></span><span>Mejor: <b>' + best.peso + 'kg x ' + best.reps + '</b> <span class="muted">' + (best.date||'') + '</span></span></div>';
  if(info.suggest){ html += '<div class="suggest">↑ Sugerencia: ' + info.suggest + '</div>'; }
  html += '</div>';
  return html;
}

function calcPlates(totalKg, barKg){
  const plates=[25,20,15,10,5,2.5,1.25];
  const target=(totalKg-barKg)/2;
  if(isNaN(target)) return {error:'invalid'};
  if(target< -0.001) return {error:'menor'};
  if(Math.abs(target)<0.001) return {empty:true};
  let remaining=Math.round(target*100)/100;
  let res=[];
  for(let p of plates){
    while(remaining>=p-0.0001){ res.push(p); remaining=Math.round((remaining-p)*100)/100; }
  }
  if(remaining>0.01) return {error:'resto', remaining, plates:res};
  return {plates:res};
}

function formatPlates(plates){
  if(!plates||!plates.length) return '';
  const counts={};
  plates.forEach(v=>{counts[v]=(counts[v]||0)+1;});
  return Object.keys(counts).sort((a,b)=>b-a).map(k=>counts[k] + 'x ' + k + 'kg').join(' + ');
}

function getBarWeight(){ try{ const v=localStorage.getItem('barWeight_4dias_v1_1'); if(v) return parseFloat(v); }catch{} return 20; }

function plateHtml(totalKg){
  const bar=getBarWeight();
  if(!totalKg || totalKg<=0) return '<div class="plate-calc"><span class="bar-tag" onclick="toggleBarWeight(event)">Barra ' + bar + 'kg</span><span>Pon un peso para ver discos</span></div>';
  const calc=calcPlates(totalKg, bar);
  if(calc.error==='menor') return '<div class="plate-calc"><span class="bar-tag" onclick="toggleBarWeight(event)">Barra ' + bar + 'kg</span><span>Peso menor que barra</span></div>';
  if(calc.empty) return '<div class="plate-calc"><span class="bar-tag" onclick="toggleBarWeight(event)">Barra ' + bar + 'kg</span><span>Solo barra</span></div>';
  if(calc.error==='resto') return '<div class="plate-calc"><span class="bar-tag" onclick="toggleBarWeight(event)">Barra ' + bar + 'kg</span><span>' + formatPlates(calc.plates) + ' + ' + calc.remaining + 'kg no cuadra</span></div>';
  const txt=formatPlates(calc.plates);
  return '<div class="plate-calc"><span class="bar-tag" onclick="toggleBarWeight(event)">Barra ' + bar + 'kg</span><span>→ ' + txt + ' <b>por lado</b></span><span style="margin-left:auto;font-size:10px;cursor:pointer;text-decoration:underline" onclick="toggleBarWeight(event)">cambiar</span></div>';
}

function toggleBarWeight(e){ if(e) e.stopPropagation(); const cur=getBarWeight(); const next = cur===20 ? 15 : cur===15 ? 10 : 20; setBarWeight(next); triggerHaptic(); renderList(); if(focusPos) renderFocus(); toast('Barra ' + next + 'kg'); }

function parseSec(s){
  const t=s.toLowerCase();
  if(t.includes("75s")) return 75;
  if(t.includes("90s")) return 90;
  if(t.includes("60s")) return 60;
  const m=t.match(/([\d.]+)(?:\s*-\s*([\d.]+))?/);
  if(!m) return 120;
  let v=parseFloat(m[1]);
  if(m[2]) v=(v+parseFloat(m[2]))/2;
  if(t.includes("min")) return Math.round(v*60);
  return Math.round(v);
}

}

async function requestWake(){ try{ if('wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); wakeBadge.classList.add('on'); } }catch{} }

function startRest(sec,label,next){
  clearInterval(restTimer);
  restLeft=sec; restTotal=sec; restExId=null;
  restLabelEl.textContent=label||'Descanso';
  restNextEl.textContent=next||'';
  restBox.classList.add('on');
  updateRest();
  requestWake();
  restTimer=setInterval(()=>{
    restLeft--; updateRest();
    if(restLeft<=0){ clearRest(); playFinish(); }
  },1000);
  RUTINA_DATA.forEach(day=>{ day.ejercicios.forEach(ex=>{ if(ex.nombre===label) restExId=ex.id; }); });
}

function updateRest(){
  const m=String(Math.floor(restLeft/60)).padStart(2,'0');
  const s=String(restLeft%60).padStart(2,'0');

let audioCtx=null;
function playFinish(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const now=audioCtx.currentTime;
    for(let k=0;k<3;k++){
      const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
      o.frequency.value=800; o.type='sine'; o.connect(g); g.connect(audioCtx.destination);
      const t=now+k*0.35; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.5,t+0.05); g.gain.exponentialRampToValueAtTime(0.0001,t+0.25); o.start(t); o.stop(t+0.3);
    }
  }catch{}
  try{ if(navigator.vibrate) navigator.vibrate([250,100,250,100,250]); }catch{}
}

function renderProgreso(){
  if(state.activeTab!==4) { progFechaEl.innerHTML=''; progDiaEl.innerHTML=''; return; }
  const byFecha={};
  (state.historial||[]).forEach(h=>{ if(!byFecha[h.fecha]) byFecha[h.fecha]=[]; byFecha[h.fecha].push(h); });
  const fechas=Object.keys(byFecha).sort((a,b)=>b.localeCompare(a));
  let htmlF='<h2>Por Fecha</h2>';
  if(fechas.length===0) htmlF+='<div class="empty">Sin registros aún. Guarda tu primera serie.</div>';
  else{
    fechas.forEach(fe=>{
      const items=byFecha[fe];
      htmlF+='<details class="prog"><summary><span>' + fe + '</span><span class="sum-sub">' + items.length + ' registro(s)</span></summary><div class="detail-inner">';
      items.sort((a,b)=>b.timestamp-a.timestamp).forEach(it=>{
        let notaTxt = it.nota ? ' (' + it.nota + ')' : '';
        htmlF+='<div class="item"><b>' + it.dia + '</b> · ' + it.nombre + ': <b>' + it.peso + 'kg</b> x ' + it.reps + ' RIR' + it.rir + notaTxt + '</div>';
      });
      htmlF+='</div></details>';
    });
  }
  progFechaEl.innerHTML=htmlF;

  const byDia={};
  (state.historial||[]).forEach(h=>{ if(!byDia[h.dia]) byDia[h.dia]=[]; byDia[h.dia].push(h); });
  let htmlD='<h2>Por Día de entreno</h2>';
  RUTINA_DATA.forEach(d=>{
    const key=d.label + ' - ' + d.sub;
    const items=byDia[key]||[];
    htmlD+='<details class="prog"><summary><span>' + key + '</span><span class="sum-sub">' + items.length + ' veces</span></summary><div class="detail-inner">';
    if(items.length===0) htmlD+='<div class="item">Sin registros</div>';
    else{
      const best={};
      items.forEach(it=>{ if(!best[it.ejercicio] || it.peso>best[it.ejercicio].peso) best[it.ejercicio]=it; });
      Object.values(best).forEach(b=>{ htmlD+='<div class="item"><b>' + b.nombre + '</b> récord: ' + b.peso + 'kg x ' + b.reps + ' (' + b.fecha + ')</div>'; });
    }
    htmlD+='</div></details>';
  });
  progDiaEl.innerHTML=htmlD;
}

document.getElementById('expCSV').onclick=()=>{
  let csv='fecha,dia,ejercicio,peso,reps,rir,nota\n';
  (state.historial||[]).forEach(h=>{ csv+=h.fecha + ',"' + h.dia + '","' + h.nombre + '",' + h.peso + ',' + h.reps + ',' + h.rir + ',"' + (h.nota||'') + '"\n'; });
  download('progreso_4dias_v1_1.csv', csv, 'text/csv');
};
document.getElementById('expWA').onclick=()=>{
  if(state.activeTab===4){ toast('Selecciona un día para compartir'); return; }
  const d=RUTINA_DATA[state.activeTab];
  let txt='*' + d.label + ' - ' + d.sub + '* - ' + todayISO() + '\n';
  d.ejercicios.forEach(ex=>{
    const logs=state.logs[ex.id];
    if(!logs||!logs.length) return;
    const last=logs[0];
    txt+='• ' + ex.nombre + ': ' + last.peso + 'kg x ' + last.reps + ' RIR' + last.rir + '\n';
  });
  window.open('https://wa.me/?text=' + encodeURIComponent(txt),'_blank');
};

const fileImport=document.getElementById('fileImport');
document.getElementById('btnImport').onclick=()=>fileImport.click();
fileImport.onchange=(e)=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(evt)=>{
    try{
      const imported=JSON.parse(evt.target.result);
      if(imported.logs || imported.historial){
        state={...state, ...imported}; save(); render(); toast('¡Datos importados con éxito!');
      }else{ toast('Formato JSON no válido'); }
    }catch{ toast('Error al leer el archivo JSON'); }
  };
  reader.readAsText(file);
};

document.getElementById('btnClearAll').onclick=()=>{
  if(!confirm('¿Borrar todo el progreso acumulado?')) return;
  state.logs={}; state.historial=[]; save(); render(); toast('Progreso borrado');
};

document.getElementById('btnMinus').onclick=()=>{ state.fs=Math.max(14,state.fs-1); applyFS(); save(); toast('Tamaño ' + state.fs + 'px'); };
document.getElementById('btnPlus').onclick=()=>{ state.fs=Math.min(20,state.fs+1); applyFS(); save(); toast('Tamaño ' + state.fs + 'px'); };

// FOCUS
const focusWrap=document.getElementById('focusWrap'), focusBody=document.getElementById('focusBody'), focusCounterEl=document.getElementById('focusCounter');
function openFocus(){ if(state.activeTab===4) return; focusPos={dayIdx:state.activeTab,exIdx:0}; focusWrap.classList.add('on'); document.body.style.overflow='hidden'; renderFocus(); }
function closeFocus(){ focusWrap.classList.remove('on'); document.body.style.overflow=''; focusPos=null; }
function renderFocus(){
  if(!focusPos) return;
  const day=RUTINA_DATA[focusPos.dayIdx]; const ex=day.ejercicios[focusPos.exIdx];
  focusCounterEl.textContent=(focusPos.exIdx+1) + '/' + day.ejercicios.length + ' · ' + day.label;
  document.getElementById('focusSub').textContent=day.sub;
  const draft=getDraft(ex.id); const logs=state.logs[ex.id]||[]; const isResting=restExId===ex.id && restLeft>0;
  const plateLine = plateHtml(parseFloat(draft.peso)||0);
  focusBody.innerHTML=
    '<div class="card">' +
      '<div style="padding:16px 16px 12px">' +
        '<div style="font-size:20px;font-weight:900;text-transform:uppercase">' + ex.nombre + '</div>' +
        '<div style="margin-top:4px;font-size:13px;color:var(--muted)">' + ex.series + ' series · ' + ex.repeticiones + ' reps · RIR ' + ex.rir + ' · Descanso ' + ex.descanso + '</div>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="grid2"><div><div class="label">Cómo</div><ul class="ul">' + ex.como.map(c=>'<li>' + c + '</li>').join('') + '</ul></div><div><div class="label">Errores</div><ul class="ul">' + ex.errores.map(c=>'<li class="muted">' + c + '</li>').join('') + '</ul></div></div>' +
        '<div class="registro" style="margin-top:14px">' +
          '<div class="reg-title">Registro</div>' +
          '<div class="row-peso"><div class="lbl">Peso</div><button class="btn-w" data-fact="p-2.5">-2.5</button><button class="btn-w" data-fact="p-1.25">-1.25</button><div class="btn-w display">' + draft.peso + ' kg</div><button class="btn-w" data-fact="p+1.25">+1.25</button><button class="btn-w" data-fact="p+2.5">+2.5</button></div>' +
          plateLine +
          '<div class="row-reps"><div class="ctrl"><div class="lbl2">Reps</div><button class="btn-s" data-fact="r-">-</button><div class="display-s">' + draft.reps + '</div><button class="btn-s" data-fact="r+">+</button></div><div class="ctrl" style="justify-content:flex-end"><div class="lbl2">RIR</div><button class="btn-s" data-fact="rir-">-</button><div class="display-s">' + draft.rir + '</div><button class="btn-s" data-fact="rir+">+</button></div></div>' +
          '<button class="btn-save" data-fact="save">Guardar · ' + draft.peso + 'kg x ' + draft.reps + ' RIR' + draft.rir + '</button>' +
          (isResting ? '<div class="rest-inline"><div class="bar"><div style="width:' + ((restTotal-restLeft)/restTotal*100) + '%"></div></div><span><b>Descanso ' + Math.floor(restLeft/60) + ':' + String(restLeft%60).padStart(2,'0') + '</b></span></div>' : '') +
        '</div>' +
      '</div>' +
    '</div>';
  
  focusBody.querySelectorAll('[data-fact]').forEach(b=>{
    b.onclick=()=>{
      triggerHaptic(); const act=b.dataset.fact;
      if(act==='p-2.5') setDraft(ex.id,{peso:Math.max(0,+(getDraft(ex.id).peso-2.5).toFixed(1))});
      if(act==='p-1.25') setDraft(ex.id,{peso:Math.max(0,+(getDraft(ex.id).peso-1.25).toFixed(2))});
      if(act==='p+1.25') setDraft(ex.id,{peso:+(getDraft(ex.id).peso+1.25).toFixed(2)});
      if(act==='p+2.5') setDraft(ex.id,{peso:+(getDraft(ex.id).peso+2.5).toFixed(1)});
      if(act==='r-') setDraft(ex.id,{reps:Math.max(1,getDraft(ex.id).reps-1)});
      if(act==='r+') setDraft(ex.id,{reps:getDraft(ex.id).reps+1});
      if(act==='rir-') setDraft(ex.id,{rir:Math.max(0,getDraft(ex.id).rir-1)});
      if(act==='rir+') setDraft(ex.id,{rir:Math.min(5,getDraft(ex.id).rir+1)});
      if(act==='save'){
        const d=getDraft(ex.id);
        const entry={date:dateShortES(), iso:todayISO(), peso:d.peso, reps:d.reps, rir:d.rir, ts:Date.now()};
        if(!state.logs[ex.id]) state.logs[ex.id]=[];
        state.logs[ex.id]=[entry, ...state.logs[ex.id]].slice(0,30);
        state.historial.push({fecha:entry.iso, dia:day.label + ' - ' + day.sub, timestamp:entry.ts, ejercicio:ex.id, nombre:ex.nombre, peso:d.peso, reps:d.reps, rir:d.rir, date:entry.date});
        save(); startRest(parseSec(ex.descanso), ex.nombre, 'Guardado ' + d.peso + 'kg'); toast('Guardado ' + d.peso + 'kg x ' + d.reps); renderFocus(); renderList(); renderProgreso();
      }else{ save(); renderFocus(); renderList(); }
    };
  });
}

document.getElementById('btnFocus').onclick=openFocus;
document.getElementById('focusClose').onclick=closeFocus;
document.getElementById('focusPrev').onclick=()=>{ if(focusPos && focusPos.exIdx>0){ focusPos.exIdx--; renderFocus(); } };
document.getElementById('focusNext').onclick=()=>{ if(!focusPos) return; const day=RUTINA_DATA[focusPos.dayIdx]; if(focusPos.exIdx<day.ejercicios.length-1){ focusPos.exIdx++; renderFocus(); } else closeFocus(); };

function render(){ renderTabs(); renderList(); renderProgreso(); updateSessionUI(); }
render();
</script>
</body>
</html>
